<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vezno - Isletme Tarayici</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Vezno Isletme Tarayici</h1>
    <p>Koordinat / mahalle ve yaricap girin, taramak istediginiz isletme turunu secin.</p>
  </header>

  <main class="layout">
    <section class="panel">
      <form id="search-form">
        <div class="field">
          <label for="place">Mahalle / Adres Ara (opsiyonel)</label>
          <div class="row">
            <input type="text" id="place" placeholder="Orn: Aydinkent Mahallesi" />
            <button type="button" id="geocode-btn">Konumu Bul</button>
          </div>
          <div id="geocode-results" class="suggestions"></div>
        </div>

        <div class="field row">
          <div>
            <label for="lat">Enlem (Lat)</label>
            <input type="number" step="any" id="lat" required placeholder="41.0082" />
          </div>
          <div>
            <label for="lon">Boylam (Lon)</label>
            <input type="number" step="any" id="lon" required placeholder="28.9784" />
          </div>
        </div>

        <div class="field">
          <label for="radius">Yaricap (metre): <span id="radius-value">1000</span> m</label>
          <input type="range" id="radius" min="100" max="10000" step="100" value="1000" />
        </div>

        <div class="field">
          <label for="source">Veri Kaynagi</label>
          <select id="source">
            <option value="osm">OpenStreetMap (ucretsiz)</option>
            <option value="google">Google Places</option>
          </select>
        </div>

        <div class="field">
          <label for="category">Isletme Turu</label>
          <select id="category"></select>
        </div>

        <div class="field" id="custom-tag-field" hidden>
          <label for="customTag">Ozel OSM Etiketi (anahtar=deger)</label>
          <input type="text" id="customTag" placeholder="Orn: amenity=veterinary" />
        </div>

        <button type="submit" id="search-btn">Isletmeleri Tara</button>
        <p id="status" class="status"></p>
      </form>
    </section>

    <section class="results">
      <div id="map"></div>
      <div id="results-header"></div>
      <ul id="results-list"></ul>
    </section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
